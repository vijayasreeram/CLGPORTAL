# ================================================================
# docker-compose.yml
# Orchestrates the portal app + (optional) Nginx reverse proxy.
# ================================================================

version: "3.9"

services:

  # -----------------------------------------------------------------
  # Portal Application (Flask via Gunicorn)
  # -----------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: internship_portal_app
    restart: unless-stopped
    env_file:
      - .env                          # Loads SECRET_KEY, PROCTOR_HMAC_SECRET, etc.
    environment:
      FLASK_DEBUG: "False"            # Always False in production
      PORT: "5000"
      GUNICORN_WORKERS: "4"
    ports:
      - "5000:5000"                   # Expose directly; comment this out if using nginx
    volumes:
      - ./data:/app/data              # Persist student CSVs, certificates, resumes
      - ./model:/app/model            # Persist trained ML model artifacts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # -----------------------------------------------------------------
  # Nginx Reverse Proxy (optional — uncomment to enable)
  # Routes external traffic to Gunicorn and serves static files.
  # -----------------------------------------------------------------
  # nginx:
  #   image: nginx:1.25-alpine
  #   container_name: internship_portal_nginx
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
  #     - ./static:/app/static:ro
  #   depends_on:
  #     - app

volumes:
  # Named volume for data persistence across container restarts
  portal_data:
