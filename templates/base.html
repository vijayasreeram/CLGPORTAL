<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ title or "Admin Portal" }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <style>
        :root {
            --primary-gold: #e2b04a;
            --white: #ffffff;
            --bg-soft: #fcfbf7;
            --dark: #1a1a1a;
            --glass: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(226, 176, 74, 0.2);
            --spring-easing: cubic-bezier(0.68, -0.6, 0.32, 1.6);
        }

        body {
            margin: 0;
            background-color: var(--bg-soft);
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
        }

        /* Trigger Button: "Hummingbird" - Magnetic Style */
        .hummingbird-btn {
            position: fixed;
            top: 30px;
            left: 30px;
            z-index: 2100;
            background: var(--white);
            border: 1px solid var(--glass-border);
            width: 50px;
            height: 50px;
            border-radius: 16px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            transition: all 0.4s var(--spring-easing);
        }

        .hummingbird-btn span {
            display: block;
            width: 20px;
            height: 2px;
            background: var(--dark);
            border-radius: 2px;
            transition: 0.3s;
        }

        .hummingbird-btn:hover {
            transform: scale(1.1) rotate(5deg);
            border-color: var(--primary-gold);
            box-shadow: 0 15px 35px rgba(226, 176, 74, 0.2);
        }

        /* Sidebar Drawer: "Wolf" - Deep Glassmorphism */
        .wolf-drawer {
            position: fixed;
            top: 20px;
            bottom: 20px;
            left: -350px; 
            width: 300px;
            background: var(--glass);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            z-index: 2000;
            padding: 100px 20px 30px;
            border-radius: 0 40px 40px 0;
            box-shadow: 30px 0 60px rgba(0,0,0,0.03);
            border: 1px solid var(--glass-border);
            border-left: none;
            display: flex;
            flex-direction: column;
            transition: all 0.6s cubic-bezier(0.85, 0, 0.15, 1);
        }

        .wolf-drawer.open {
            left: 0;
        }

        /* Nav Links: "Falcon" */
        .falcon-nav {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-grow: 1;
        }

        .falcon-link {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 16px 20px;
            border-radius: 20px;
            text-decoration: none;
            color: #555;
            font-weight: 700;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        .falcon-link:hover {
            background: var(--white);
            color: var(--primary-gold);
            transform: translateX(8px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.02);
        }

        .falcon-link.active {
            background: var(--dark);
            color: var(--white);
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }

        .falcon-link.active .nav-icon {
            filter: brightness(0) invert(1);
        }

        .nav-icon {
            font-size: 1.3rem;
            transition: 0.3s;
        }

        /* Bottom Section: "Owl" - Profile Info */
        .owl-profile {
            margin-top: auto;
            background: var(--white);
            padding: 20px;
            border-radius: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid var(--glass-border);
        }

        .owl-avatar {
            width: 40px;
            height: 40px;
            background: var(--primary-gold);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: white;
        }

        /* Overlay: "Bat" */
        .bat-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(26, 26, 26, 0.1);
            backdrop-filter: blur(8px);
            z-index: 1900;
            opacity: 0;
            visibility: hidden;
            transition: all 0.5s ease;
        }

        .bat-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        /* Content Morphing: "Elephant" */
        .elephant-container {
            padding: 40px;
            transition: all 0.7s cubic-bezier(0.85, 0, 0.15, 1);
        }

        .elephant-container.pushed {
            transform: translateX(100px) scale(0.92);
            filter: grayscale(0.5);
            pointer-events: none;
            user-select: none;
        }
    </style>
</head>
<body>

{% if session.admin_user %}
<button id="menuToggle" class="hummingbird-btn">
    <span></span>
    <span style="width: 14px; align-self: flex-start; margin-left: 13px;"></span>
    <span></span>
</button>

<aside id="sidebar" class="wolf-drawer">
    <div style="margin-bottom: 50px; padding-left: 20px;">
        <span style="color: var(--primary-gold); font-weight: 800; text-transform: uppercase; letter-spacing: 3px; font-size: 0.65rem;">Intelligence Hub</span>
    </div>

    <nav class="falcon-nav">
        <a href="{{ url_for('admin.dashboard') }}" class="falcon-link {% if request.endpoint == 'dashboard' %}active{% endif %}">
            <span class="nav-icon">🏠</span>
            <span>Home</span>
        </a>
        <a href="{{ url_for('admin.add_students') }}" class="falcon-link {% if request.endpoint == 'add_students' %}active{% endif %}">
            <span class="nav-icon">➕</span>
            <span>Enroll</span>
        </a>
        <a href="{{ url_for('admin.view_students') }}" class="falcon-link {% if request.endpoint == 'view_students' %}active{% endif %}">
            <span class="nav-icon">👥</span>
            <span>Directory</span>
        </a>
        <a href="{{ url_for('admin.admin_test_results') }}" class="falcon-link {% if request.endpoint == 'admin_test_results' %}active{% endif %}">
            <span class="nav-icon">📘</span>
            <span>Analytics</span>
        </a>
    </nav>

    <div class="owl-profile">
        <div class="owl-avatar">S</div>
        <div style="overflow: hidden;">
            <p style="margin: 0; font-weight: 800; font-size: 0.85rem; color: var(--dark);">{{ session.admin_user }}</p>
            <p style="margin: 0; font-size: 0.7rem; color: #888;">Administrator</p>
        </div>
    </div>
</aside>

<div id="overlay" class="bat-overlay"></div>
{% endif %}

<main class="elephant-container" id="mainContent">
    {% block content %}{% endblock %}
</main>

<script>
    const menuBtn = document.getElementById("menuToggle");
    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("overlay");
    const mainContent = document.getElementById("mainContent");

    const toggleMenu = () => {
        sidebar.classList.toggle("open");
        overlay.classList.toggle("show");
        mainContent.classList.toggle("pushed");
        
        // Icon Animation logic
        const spans = menuBtn.querySelectorAll('span');
        if(sidebar.classList.contains('open')) {
            spans[1].style.opacity = "0";
            spans[0].style.transform = "translateY(7px) rotate(45deg)";
            spans[2].style.transform = "translateY(-7px) rotate(-45deg)";
        } else {
            spans[1].style.opacity = "1";
            spans[0].style.transform = "none";
            spans[2].style.transform = "none";
        }
    };

    menuBtn.onclick = toggleMenu;
    overlay.onclick = toggleMenu;
</script>

</body>
</html>
