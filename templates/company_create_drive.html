{% extends "company_base.html" %}

{% block title %}Create Drive{% endblock %}

{% block content %}

<style>
    :root {
        --primary-gold: #e2b04a;
        --white: #ffffff;
        --bg-soft: #fcfbf7;
        --dark: #1a1a1a;
        --glass: rgba(255, 255, 255, 0.85);
        --glass-border: rgba(226, 176, 176, 0.15);
    }

    body { background-color: var(--bg-soft); font-family: 'Plus Jakarta Sans', sans-serif; }

    /* Container: "Elephant" */
    .elephant-form-container {
        max-width: 800px;
        margin: 3rem auto;
        padding: 0 20px;
    }

    /* Card: "Gazelle" */
    .gazelle-form-card {
        background: var(--glass);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        padding: 3.5rem;
        border-radius: 35px;
        box-shadow: 0 25px 50px rgba(0,0,0,0.04);
        border: 1px solid var(--glass-border);
        animation: fadeInUp 0.8s ease-out;
    }

    /* Form Elements: "Panther" */
    .panther-label {
        font-weight: 800;
        color: var(--dark);
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 10px;
        display: block;
    }

    .panther-input, .panther-select, .panther-textarea {
        width: 100%;
        padding: 14px 20px;
        border-radius: 15px;
        border: 1px solid #eee;
        background: rgba(255, 255, 255, 0.6);
        font-family: inherit;
        font-weight: 600;
        color: var(--dark);
        transition: all 0.3s ease;
        outline: none;
        margin-bottom: 20px;
    }

    .panther-input:focus, .panther-select:focus, .panther-textarea:focus {
        border-color: var(--primary-gold);
        background: var(--white);
        box-shadow: 0 10px 20px rgba(226, 176, 74, 0.1);
    }

    /* Button: "Lion" */
    .lion-submit-btn {
        background: var(--dark);
        color: var(--white);
        width: 100%;
        padding: 18px;
        border: none;
        border-radius: 50px;
        font-weight: 800;
        font-size: 1rem;
        cursor: pointer;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        margin-top: 10px;
    }

    .lion-submit-btn:hover {
        background: var(--primary-gold);
        transform: translateY(-3px);
        box-shadow: 0 15px 30px rgba(226, 176, 74, 0.3);
    }

    .lion-submit-btn:active { transform: scale(0.98); }

    /* Section Heading: "Giraffe" */
    .giraffe-header {
        text-align: center;
        margin-bottom: 2.5rem;
    }

    .giraffe-header h2 {
        font-size: 2.5rem;
        font-weight: 900;
        color: var(--dark);
        letter-spacing: -1.5px;
    }

    .giraffe-header span { color: var(--primary-gold); }

    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(40px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>

<div class="elephant-form-container">
    <div class="gazelle-form-card">
        
        <header class="giraffe-header">
            <h2>🧷 Create New <span>Drive.</span></h2>
            <p style="color: #888; font-weight: 500;">Fill in the details to launch a new placement opportunity.</p>
        </header>

        <form method="POST">

            <div class="form-group">
                <label class="panther-label">Position Offered</label>
                <input type="text" name="position" class="panther-input" placeholder="e.g. Software Engineer" required>
            </div>

            <div class="form-group">
                <label class="panther-label">Package Details</label>
                <div style="display: flex; gap: 15px;">
                    <input type="number" step="0.1" name="package_value" class="panther-input" placeholder="Value" required>
                    <select name="package_type" class="panther-select" style="width: 200px;">
                        <option value="LPA">LPA</option>
                        <option value="Per Month">Per Month</option>
                    </select>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div class="form-group">
                    <label class="panther-label">Duration (Months)</label>
                    <input type="number" name="time_period" class="panther-input" placeholder="e.g. 6" required>
                </div>

                <div class="form-group">
                    <label class="panther-label">Students Required</label>
                    <input type="number" name="number_required" class="panther-input" placeholder="e.g. 50" required>
                </div>
            </div>

            <div class="form-group">
                <label class="panther-label">Minimum CGPA Criteria</label>
                <input type="number" step="0.01" name="min_cgpa" class="panther-input" placeholder="e.g. 7.50">
            </div>

            <div class="form-group">
                <label class="panther-label">Domain Expertise</label>
                <select name="domain_required" class="panther-select" required>
                    <option value="">-- Select Preferred Domain --</option>
                    <option value="Software Development">Software Development</option>
                    <option value="Web Development">Web Development</option>
                    <option value="Machine Learning / AI">Machine Learning / AI</option>
                    <option value="Cyber Security">Cyber Security</option>
                    <option value="Cloud Computing">Cloud Computing</option>
                </select>
            </div>

            <div class="form-group">
                <label class="panther-label">Job Description</label>
                <textarea name="description" class="panther-textarea" rows="4" placeholder="Describe the role and responsibilities..."></textarea>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div class="form-group">
                    <label class="panther-label">Work Mode</label>
                    <select name="mode" class="panther-select">
                        <option value="Online">Online</option>
                        <option value="Offline">Offline</option>
                        <option value="Hybrid">Hybrid</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="panther-label">Location</label>
                    <input type="text" name="location" class="panther-input" placeholder="e.g. Bangalore, India">
                </div>
            </div>

            <div class="form-group">
                <label class="panther-label">Registration Deadline</label>
                <input type="date" name="end_date" class="panther-input" required>
            </div>

            <button type="submit" class="lion-submit-btn">Launch Drive</button>

        </form>

    </div>
</div>

{% endblock %}
