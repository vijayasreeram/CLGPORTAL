{% extends "student_base.html" %}
{% block content %}

<style>
    :root {
        --primary-gold: #e2b04a;
        --white: #ffffff;
        --bg-soft: #fcfbf7;
        --dark: #1a1a1a;
        --glass: rgba(255, 255, 255, 0.85);
        --glass-border: rgba(226, 176, 176, 0.15);
    }

    body { 
        background-color: var(--bg-soft); 
        font-family: 'Plus Jakarta Sans', sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 80vh;
        margin: 0;
    }

    /* Container: "Elephant" */
    .elephant-password-container {
        width: 100%;
        max-width: 420px;
        padding: 20px;
        margin: 0 auto;
    }

    /* Card: "Gazelle" */
    .gazelle-password-card {
        background: var(--glass);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        padding: 3.5rem 2.5rem;
        border-radius: 40px;
        box-shadow: 0 30px 60px rgba(0,0,0,0.05);
        border: 1px solid var(--glass-border);
        text-align: center;
        animation: slideUp 0.8s cubic-bezier(0.165, 0.84, 0.44, 1);
    }

    /* Header: "Giraffe" */
    .giraffe-header h2 {
        font-size: 2.2rem;
        font-weight: 900;
        color: var(--dark);
        letter-spacing: -1.5px;
        margin-bottom: 10px;
    }
    .giraffe-header span { color: var(--primary-gold); }

    /* Inputs: "Panther" */
    .panther-input {
        width: 100%;
        padding: 16px 20px;
        border-radius: 18px;
        border: 1px solid #eee;
        background: rgba(255, 255, 255, 0.6);
        font-family: inherit;
        font-weight: 600;
        color: var(--dark);
        box-sizing: border-box;
        transition: all 0.3s ease;
        outline: none;
        margin-bottom: 20px;
        text-align: center;
    }

    .panther-input:focus {
        border-color: var(--primary-gold);
        background: var(--white);
        box-shadow: 0 10px 25px rgba(226, 176, 74, 0.1);
    }

    /* Button: "Lion" */
    .lion-save-btn {
        background: var(--dark);
        color: var(--white);
        width: 100%;
        padding: 18px;
        border: none;
        border-radius: 50px;
        font-weight: 800;
        font-size: 1rem;
        cursor: pointer;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    }

    .lion-save-btn:hover {
        background: var(--primary-gold);
        transform: translateY(-5px);
        box-shadow: 0 15px 30px rgba(226, 176, 74, 0.35);
    }

    /* Alert: "Owl" */
    .owl-error {
        margin-top: 20px;
        padding: 12px;
        background: #fff1f2;
        color: #e11d48;
        border-radius: 12px;
        font-weight: 700;
        font-size: 0.85rem;
        border: 1px solid #fee2e2;
    }

    @keyframes slideUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>

<div class="elephant-password-container">
    <div class="gazelle-password-card">
        
        <header class="giraffe-header">
            <div style="font-size: 3rem; margin-bottom: 15px;">🛡️</div>
            <h2>New <span>Password.</span></h2>
            <p style="color: #888; font-weight: 500; margin-bottom: 30px;">Update your security credentials</p>
        </header>

        <form method="post">
            <input type="password" name="new_password" class="panther-input" placeholder="Enter New Password" required>
            <input type="password" name="confirm_password" class="panther-input" placeholder="Confirm New Password" required>
            
            <button type="submit" class="lion-save-btn">
                Update Password
            </button>
        </form>

        {% if get_flashed_messages() %}
        <div class="owl-error">
            ⚠️ {{ get_flashed_messages()[0] }}
        </div>
        {% endif %}

    </div>
</div>

{% endblock %}
