{% extends 'base.html' %}
{% block content %}

<style>
    :root {
        --primary-gold: #e2b04a;
        --white: #ffffff;
        --bg-soft: #fcfbf7;
        --dark-charcoal: #1a1a1a;
        --glass: rgba(255, 255, 255, 0.9);
        --glass-border: rgba(226, 176, 176, 0.15);
    }

    body {
        background-color: var(--bg-soft);
        font-family: 'Plus Jakarta Sans', sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
    }

    /* Main Container: "Elephant" */
    .elephant-register-wrapper {
        display: flex;
        width: 100%;
        max-width: 950px;
        height: 600px;
        background: var(--white);
        border-radius: 40px;
        box-shadow: 0 40px 100px rgba(0,0,0,0.08);
        overflow: hidden;
        animation: elephantExpand 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Left Branding Side: "Giraffe" */
    .giraffe-panel {
        flex: 1;
        background: var(--dark-charcoal);
        padding: 60px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        color: white;
        position: relative;
    }

    /* Subtle background pattern */
    .giraffe-panel::before {
        content: '';
        position: absolute;
        width: 100%; height: 100%;
        top: 0; left: 0;
        background-image: radial-gradient(var(--primary-gold) 0.5px, transparent 0.5px);
        background-size: 20px 20px;
        opacity: 0.05;
    }

    .giraffe-panel h1 {
        font-size: 3rem;
        font-weight: 900;
        line-height: 1.1;
        margin: 0;
        z-index: 1;
    }

    .giraffe-panel h1 span {
        color: var(--primary-gold);
    }

    .giraffe-panel p {
        color: #888;
        margin-top: 20px;
        font-weight: 500;
        z-index: 1;
        line-height: 1.6;
    }

    /* Right Form Side: "Gazelle" */
    .gazelle-form-side {
        flex: 1.2;
        background: var(--white);
        padding: 60px;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    /* Input Group: "Panther" */
    .panther-box {
        margin-bottom: 25px;
    }

    .panther-label {
        font-weight: 800;
        color: #999;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        margin-bottom: 12px;
        display: block;
    }

    .panther-input {
        width: 100%;
        padding: 18px 22px;
        border-radius: 16px;
        border: 1px solid #eee;
        background: #fcfcfc;
        font-family: inherit;
        font-weight: 600;
        color: var(--dark-charcoal);
        transition: all 0.3s ease;
        outline: none;
        box-sizing: border-box;
    }

    .panther-input:focus {
        border-color: var(--primary-gold);
        background: var(--white);
        box-shadow: 0 10px 30px rgba(226, 176, 74, 0.12);
        transform: scale(1.02);
    }

    /* Action Button: "Lion" */
    .lion-btn {
        background: var(--dark-charcoal);
        color: white;
        width: 100%;
        padding: 20px;
        border: none;
        border-radius: 50px;
        font-weight: 800;
        font-size: 1rem;
        cursor: pointer;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        margin-top: 15px;
        box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    }

    .lion-btn:hover {
        background: var(--primary-gold);
        transform: translateY(-5px);
        box-shadow: 0 15px 35px rgba(226, 176, 74, 0.3);
    }

    /* Footer: "Falcon" */
    .falcon-link-area {
        margin-top: 35px;
        text-align: center;
        font-weight: 600;
        font-size: 0.9rem;
        color: #bbb;
    }

    .falcon-link {
        color: var(--primary-gold);
        text-decoration: none;
        font-weight: 800;
        margin-left: 8px;
        transition: 0.3s;
    }

    .falcon-link:hover {
        text-decoration: underline;
    }

    /* Animation */
    @keyframes elephantExpand {
        from { opacity: 0; transform: scale(0.95) translateY(20px); }
        to { opacity: 1; transform: scale(1) translateY(0); }
    }

    @media (max-width: 900px) {
        .giraffe-panel { display: none; }
        .elephant-register-wrapper { max-width: 480px; height: auto; }
    }
</style>

<div class="elephant-register-wrapper">
    <div class="giraffe-panel">
        <div style="font-size: 3rem; margin-bottom: 25px;">📝</div>
        <h1>Create <span>Administrator.</span></h1>
        <p>Establish new credentials to manage the student intelligence ecosystem and recruitment drives.</p>
    </div>

    <div class="gazelle-form-side">
        <h2 style="font-weight: 950; margin-bottom: 40px; color: var(--dark-charcoal); letter-spacing: -1.5px; font-size: 2rem;">Register</h2>
        
        <form method="POST">
            <div class="panther-box">
                <label class="panther-label">Admin Username</label>
                <input type="text" name="username" class="panther-input" placeholder="Set unique username" required>
            </div>

            <div class="panther-box">
                <label class="panther-label">Access Password</label>
                <input type="password" name="password" class="panther-input" placeholder="Set secure password" required>
            </div>

            <button type="submit" class="lion-btn">
                Create Admin Account
            </button>
        </form>

        <div class="falcon-link-area">
            Already registered? <a href="{{ url_for('admin.login') }}" class="falcon-link">Login here</a>
        </div>
    </div>
</div>

{% endblock %}
