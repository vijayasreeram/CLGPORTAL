<!DOCTYPE html>
<html>
<head>
    <title>Student Portal</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


    <style>
        /* Extra student-specific enhancements */
        .student-nav {
            background: #1f2937;
            padding: 15px 25px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 8px;
            margin-bottom: 25px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
        }

        .student-nav a {
            color: white;
            text-decoration: none;
            font-weight: 500;
            margin-left: 15px;
        }

        .student-nav a:hover {
            opacity: 0.8;
        }

        .panel {
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #cbd5e0;
            background: #ffffff;
            border-radius: 10px;
            display: none;
        }

        .sem-box {
            background: #2b6cb0;
            color: white;
            padding: 12px;
            border-radius: 10px;
            margin-top: 12px;
            font-size: 18px;
            cursor: pointer;
        }

        .sem-box:hover {
            background: #245a99;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="student-nav">
        <div>
            🎓 <b>Student Portal</b>
        </div>
        <div>
            <a href="{{ url_for('student.dashboard') }}">Dashboard</a>
            <a href="{{ url_for('student.student_drives') }}">Drives</a>
            <a href="{{ url_for('student.logout') }}" style="color:#ffb3b3;">Logout</a>
        </div>
    </div>

    {% block content %}{% endblock %}

</div>

</body>
</html>
