{% extends "student_base.html" %}
{% block content %}

<style>
    :root {
        --primary-gold: #e2b04a;
        --white: #ffffff;
        --bg-soft: #fcfbf7;
        --dark: #1a1a1a;
        --glass: rgba(255, 255, 255, 0.85);
        --glass-border: rgba(226, 176, 176, 0.15);
    }

    body { 
        background-color: var(--bg-soft); 
        font-family: 'Plus Jakarta Sans', sans-serif;
    }

    /* Layout Wrapper: "Elephant" */
    .elephant-drives-wrapper {
        max-width: 600px;
        margin: 5rem auto;
        padding: 0 20px;
        text-align: center;
    }

    /* Card: "Gazelle" */
    .gazelle-announcement-card {
        background: var(--glass);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        padding: 4rem 3rem;
        border-radius: 40px;
        box-shadow: 0 30px 60px rgba(0,0,0,0.05);
        border: 1px solid var(--glass-border);
        animation: floatIn 0.8s ease-out;
    }

    /* Header: "Giraffe" */
    .giraffe-header h2 {
        font-size: 2.8rem;
        font-weight: 900;
        color: var(--dark);
        margin-bottom: 10px;
        letter-spacing: -2px;
    }
    .giraffe-header span { color: var(--primary-gold); }

    /* Button: "Lion" */
    .lion-action-btn {
        background: var(--dark);
        color: var(--white);
        padding: 20px 40px;
        border-radius: 50px;
        text-decoration: none;
        font-weight: 800;
        font-size: 1.1rem;
        display: block;
        margin-top: 30px;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        box-shadow: 0 15px 30px rgba(0,0,0,0.1);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
    }

    .lion-action-btn:hover {
        background: var(--primary-gold);
        transform: translateY(-8px) scale(1.02);
        box-shadow: 0 20px 40px rgba(226, 176, 74, 0.3);
    }

    .lion-action-btn:active {
        transform: scale(0.98);
    }

    @keyframes floatIn {
        from { opacity: 0; transform: translateY(40px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>

<div class="elephant-drives-wrapper">
    <div class="gazelle-announcement-card">
        
        <header class="giraffe-header">
            <div style="font-size: 4rem; margin-bottom: 20px;">📢</div>
            <h2>Placement <span>Drives.</span></h2>
            <p style="color: #888; font-weight: 500; line-height: 1.6;">
                Access the latest recruitment schedules and career opportunities curated for your profile.
            </p>
        </header>

        <a href="{{ url_for('student.student_current_drives') }}" class="lion-action-btn">
            📄 View Available Opportunities
        </a>

    </div>
</div>

{% endblock %}
