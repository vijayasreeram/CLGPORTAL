<!DOCTYPE html>
<html>
<head>
    <title>Student Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gold: #e2b04a;
            --white: #ffffff;
            --bg-soft: #fcfbf7;
            --dark: #1a1a1a;
            --glass: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(226, 176, 176, 0.15);
        }

        body { 
            background-color: var(--bg-soft); 
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            position: relative;
        }

        /* Background glow effect */
        body::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            top: -150px;
            left: -150px;
            background: radial-gradient(circle, rgba(226, 176, 74, 0.06) 0%, transparent 70%);
            z-index: -1;
        }

        /* Layout Container: "Elephant" */
        .elephant-login-container {
            width: 100%;
            max-width: 440px;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Premium Login Card: "Gazelle" */
        .gazelle-login-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 3.5rem 2.8rem;
            border-radius: 40px;
            box-shadow: 0 35px 70px rgba(0,0,0,0.06);
            border: 1px solid var(--glass-border);
            text-align: center;
            animation: floatIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Header: "Giraffe" */
        .giraffe-header h2 {
            font-size: 2.1rem;
            font-weight: 900;
            color: var(--dark);
            margin: 0 0 5px 0;
            letter-spacing: -1px;
        }
        .giraffe-header span { 
            color: var(--primary-gold); 
        }

        /* Inputs: "Panther" */
        .panther-group {
            text-align: left;
            margin-bottom: 22px;
        }

        .panther-label {
            font-weight: 800;
            color: #999;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-left: 5px;
            margin-bottom: 8px;
            display: block;
        }

        .panther-input {
            width: 100%;
            padding: 16px 20px;
            border-radius: 18px;
            border: 1px solid #eee;
            background: rgba(255, 255, 255, 0.6);
            font-family: inherit;
            font-weight: 600;
            color: var(--dark);
            box-sizing: border-box;
            transition: all 0.3s ease;
            outline: none;
        }

        .panther-input:focus {
            border-color: var(--primary-gold);
            background: var(--white);
            box-shadow: 0 10px 25px rgba(226, 176, 74, 0.1);
        }

        /* Button: "Lion" */
        .lion-login-btn {
            background: var(--dark);
            color: var(--white);
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 50px;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            margin-top: 10px;
        }

        .lion-login-btn:hover {
            background: var(--primary-gold);
            color: var(--dark);
            transform: translateY(-4px);
            box-shadow: 0 15px 30px rgba(226, 176, 74, 0.3);
        }

        .info-badge {
            font-size: 0.8rem;
            color: #7a6026;
            background: #fffbf0;
            padding: 12px 16px;
            border-left: 4px solid var(--primary-gold);
            border-radius: 14px;
            margin-top: 20px;
            text-align: left;
            font-weight: 500;
            line-height: 1.4;
        }

        .error-message {
            color: #d9534f;
            font-size: 0.9rem;
            font-weight: 600;
            margin-top: 15px;
            margin-bottom: 0;
        }

        @keyframes floatIn {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
    </style>
</head>
<body>

<div class="elephant-login-container">
    <div class="gazelle-login-card">
        
        <header class="giraffe-header">
            <div style="font-size: 3rem; margin-bottom: 10px;">🎓</div>
            <h2>Student <span>Login.</span></h2>
            <p style="color: #aaa; font-size: 0.9rem; font-weight: 500; margin-bottom: 35px;">Access your academic & skill profile</p>
        </header>

        <form method="POST">
            <div class="panther-group">
                <label class="panther-label">Register Number</label>
                <input type="text" name="register_number" class="panther-input" placeholder="e.g. 312221XXXXXX" required>
            </div>

            <div class="panther-group">
                <label class="panther-label">Password</label>
                <input type="password" name="password" class="panther-input" placeholder="••••••••" required>
            </div>

            <div class="info-badge">
                <b>Default Password:</b> <span style="color: var(--primary-gold-hover); font-weight: 700;">helloeveryone</span><br>
                Use this only for your initial login attempt.
            </div>

            <br>

            <button type="submit" class="lion-login-btn">
                Access Dashboard
            </button>
        </form>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <p class="error-message">⚠️ {{ messages[0] }}</p>
            {% endif %}
        {% endwith %}

    </div>
</div>

</body>
</html>
