{% extends "student_base.html" %}
{% block content %}

<div class="elephant-profile-container">
    <div class="gazelle-card" style="max-width:600px; margin:auto;">
        <h3>📄 Upload Certificate</h3>

        <form method="POST" enctype="multipart/form-data">
            <div style="margin-bottom:15px;">
                <label style="font-weight:700;">Certificate Name</label>
                <input type="text" name="certificate_name" required
                       style="width:100%; padding:12px; border-radius:12px; border:1px solid #ddd;">
            </div>

            <div style="margin-bottom:20px;">
                <label style="font-weight:700;">Certificate File (PDF / Image)</label>
                <input type="file" name="certificate" accept=".pdf,.png,.jpg,.jpeg" required
                       style="width:100%; padding:12px;">
            </div>

            <button type="submit" class="lion-btn">
                ✅ Submit for Approval
            </button>
        </form>
    </div>
</div>

{% endblock %}
